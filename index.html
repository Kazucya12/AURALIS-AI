<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Auralis AI</title>
<meta name="description" content="Auralis AI: asisten AI pribadi untuk kode, tulisan, dan analisis."><meta name="theme-color" content="#0e0c1d"><meta property="og:title" content="Auralis AI"><meta property="og:description" content="Asisten AI pribadi untuk kode, tulisan, dan analisis."><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0c1d;--s1:#171430;--s2:#201c3f;--bd:#2f2a58;--tx:#ece9ff;--mu:#9a94c9;--ac:#8b7bff;--ac2:#5eead4;--er:#ff6b8a;--fs:15px}
[data-t=light]{--bg:#f5f3ff;--s1:#fff;--s2:#ece8ff;--bd:#d9d3f5;--tx:#1d1840;--mu:#6b64a0}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:var(--fs)/1.55 Sora,system-ui,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.noanim *{animation:none!important;transition:none!important}
.hide{display:none!important}
input,select,textarea{background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:11px 13px;width:100%;outline:0;transition:border .2s}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
.btn{background:linear-gradient(135deg,var(--ac),#6f5cf5);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;transition:transform .15s,filter .2s}
.btn:active{transform:scale(.97)}.btn:hover{filter:brightness(1.1)}
.ghost{background:var(--s2);border:1px solid var(--bd);padding:9px 14px;border-radius:10px}
.danger{color:var(--er)}
/* auth */
#auth{position:fixed;inset:0;display:grid;place-items:center;padding:20px;overflow:auto}
.orb{position:fixed;width:60vmax;height:60vmax;border-radius:50%;opacity:.4;animation:drift 16s ease-in-out infinite alternate;pointer-events:none;will-change:transform}
.o1{background:radial-gradient(circle,var(--ac),transparent 65%);top:-25vmax;left:-15vmax}.o2{background:radial-gradient(circle,var(--ac2),transparent 65%);bottom:-30vmax;right:-20vmax;animation-delay:-8s}
@keyframes drift{to{transform:translate3d(8vmax,6vmax,0) scale(1.15)}}
.card{position:relative;width:min(400px,100%);background:var(--s1);border:1px solid var(--bd);border-radius:22px;padding:28px;animation:rise .7s cubic-bezier(.2,.9,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.25em;margin-bottom:6px}
.logo i{width:30px;height:30px;border-radius:10px;background:conic-gradient(from 200deg,var(--ac),var(--ac2),var(--ac));display:block;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sub{color:var(--mu);font-size:.9em;margin-bottom:18px}
.tabs{display:flex;background:var(--s2);border-radius:12px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;padding:8px;border-radius:9px;color:var(--mu);transition:.2s}
.tabs .on{background:var(--s1);color:var(--tx);box-shadow:0 2px 8px #0003}
.f{margin-bottom:12px;position:relative}.f label{font-size:.8em;color:var(--mu);display:block;margin-bottom:5px}
.eye{position:absolute;right:8px;bottom:6px;padding:6px;color:var(--mu);font-size:.8em}
.err{color:var(--er);font-size:.85em;min-height:1.3em;margin-bottom:8px}
/* app */
#app{display:flex;height:100%}
#side{width:290px;background:var(--s1);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:14px;gap:10px;transition:transform .3s cubic-bezier(.2,.9,.3,1);z-index:20}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:3px}
.ci{display:flex;align-items:center;gap:6px;padding:10px 12px;border-radius:11px;color:var(--mu);cursor:pointer;transition:background-color .15s,color .15s}
.ci span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci:hover{background:var(--s2)}.ci.on{background:var(--s2);color:var(--tx);box-shadow:inset 3px 0 var(--ac)}
.ci b{opacity:0;padding:0 4px;font-weight:400}.ci:hover b,.ci.on b{opacity:1}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--s2)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.me div:nth-child(2){flex:1;min-width:0}.me small{color:var(--mu);display:block;overflow:hidden;text-overflow:ellipsis}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--bd)}
.top h1{font-size:1em;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.top select{width:auto;padding:8px;max-width:130px;text-overflow:ellipsis}
#menu{display:none;font-size:1.3em;padding:4px 8px}
#msgs{flex:1;overflow:auto;padding:20px 16px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.w{max-width:780px;margin:0 auto}
.m{display:flex;gap:12px;margin-bottom:20px;contain:layout style}.m.new{animation:in .4s cubic-bezier(.2,.9,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.m .av{width:30px;height:30px;font-size:.8em;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.m.u{flex-direction:row-reverse}.m.u .b{background:var(--s2);border:1px solid var(--bd);padding:10px 14px;border-radius:16px 4px 16px 16px}
.b{min-width:0;overflow-wrap:anywhere;max-width:calc(100% - 44px)}
.acts{display:flex;gap:4px;margin-top:6px}.acts button{color:var(--mu);font-size:.78em;padding:3px 8px;border-radius:8px}.acts button:hover{background:var(--s2);color:var(--tx)}
.b h4{margin:8px 0 4px}.b ul,.b ol{padding-left:22px}
.b a{color:var(--ac2)}.b table{border-collapse:collapse;margin:8px 0;font-size:.9em}.b th,.b td{border:1px solid var(--bd);padding:6px 10px}.b th{background:var(--s2)}
.b blockquote{border-left:3px solid var(--ac);padding-left:10px;color:var(--mu)}.b hr{border:0;border-top:1px solid var(--bd);margin:10px 0}
.b code{background:var(--s2);padding:1px 6px;border-radius:6px;font-size:.88em}
.code{background:#0a0816;border:1px solid var(--bd);border-radius:12px;margin:8px 0;overflow:hidden}
.ch{display:flex;justify-content:space-between;padding:6px 12px;background:#15112e;color:var(--mu);font-size:.78em}
.ch button{color:var(--ac2)}
pre{padding:12px;overflow:auto;font:.84em/1.5 ui-monospace,Menlo,monospace;color:#e6e2ff}
.dots{display:inline-flex;gap:4px;padding:8px 0}.dots i{width:7px;height:7px;border-radius:50%;background:var(--ac);animation:bn 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bn{50%{transform:translateY(-6px);opacity:.4}}
.empty{text-align:center;padding:9vh 0 0}.empty h2{font-size:1.7em;margin:10px 0 4px}
.empty p{color:var(--mu);margin-bottom:22px}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;text-align:left}
.chips button{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:13px;transition:border-color .2s,transform .2s}
.chips button:hover{border-color:var(--ac);transform:translateY(-2px)}
.comp{padding:10px 16px 14px}.cbox{max-width:780px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--s1);border:1px solid var(--bd);border-radius:20px;padding:8px;transition:border .2s}
.cbox:focus-within{border-color:var(--ac)}
.cbox textarea{border:0;background:none;resize:none;max-height:150px;padding:9px}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--mu)}
.ib.rec{color:var(--er);animation:bn .8s infinite}
.send{background:linear-gradient(135deg,var(--ac),#6f5cf5);color:#fff}
/* modal */
#md,#dc{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:14px;z-index:50;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.mb{background:var(--s1);border:1px solid var(--bd);border-radius:20px;width:min(560px,100%);max-height:90dvh;display:flex;flex-direction:column;animation:rise .3s}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;font-weight:600}
.st{display:flex;gap:4px;padding:0 16px;overflow:auto;border-bottom:1px solid var(--bd)}
.st button{padding:10px 12px;color:var(--mu);white-space:nowrap;border-bottom:2px solid transparent}.st .on{color:var(--tx);border-color:var(--ac)}
.sp{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw i{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent}.sw i.on{border-color:var(--tx)}
.tg{width:46px;height:26px;border-radius:99px;background:var(--bd);position:relative;flex:none;transition:.2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.tg.on{background:var(--ac)}.tg.on::after{left:23px}
.hint{font-size:.8em;color:var(--mu)}
#toast{position:fixed;bottom:90px;left:50%;transform:translate(-50%,20px);background:var(--s2);border:1px solid var(--bd);padding:10px 18px;border-radius:99px;opacity:0;transition:.3s;z-index:99;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#shade{display:none}
.pic{max-width:min(220px,100%);border-radius:12px;display:block;margin-bottom:6px}
.chip{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:7px 12px;font-size:.84em;margin:0 auto 8px;max-width:780px}
.chip button{color:var(--mu)}#db{white-space:pre-wrap}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:760px){
#side{will-change:transform;position:fixed;inset:0 auto 0 0;width:min(86vw,320px);transform:translateX(-100%);padding-top:calc(14px + env(safe-area-inset-top))}
#side.open{transform:none}#menu{display:block}
#shade.open{display:block;position:fixed;inset:0;background:#0007;z-index:15}
.top select{max-width:96px}.top .ghost{padding:9px 11px}}
</style></head><body>

<div id="auth"><div class="orb o1"></div><div class="orb o2"></div>
<div class="card">
<div class="logo"><i></i>Auralis AI</div><p class="sub">Asisten AI pribadi untuk kode, tulisan, dan analisis.</p>
<div class="tabs"><button class="on" data-m="in">Masuk</button><button data-m="up">Daftar</button></div>
<div class="f up hide"><label>Nama</label><input id="an" autocomplete="name" placeholder="Nama lengkap"></div>
<div class="f"><label>Email</label><input id="ae" type="email" autocomplete="email" placeholder="kamu@email.com"></div>
<div class="f"><label>Kata sandi</label><input id="ap" type="password" autocomplete="current-password" placeholder="Minimal 6 karakter"><button class="eye" id="eye">Lihat</button></div>
<div class="f up hide"><label>Ulangi kata sandi</label><input id="ap2" type="password" autocomplete="new-password"></div>
<div class="err" id="aerr"></div>
<button class="btn" id="asub" style="width:100%">Masuk</button>
</div></div>

<div id="app" class="hide">
<aside id="side">
<div class="logo"><i></i>Auralis AI</div>
<button class="btn" id="new">+ Obrolan baru</button>
<input id="q" placeholder="Cari obrolan...">
<div id="list"></div>
<div class="me"><div class="av" id="mav"></div><div><b id="mnm"></b><small id="mem"></small></div><button class="ghost" id="setb">Atur</button></div>
</aside><div id="shade"></div>
<section id="main">
<div class="top"><button id="menu">☰</button><h1 id="ttl" title="Ketuk untuk ganti nama">Obrolan baru</h1>
<select id="mode"></select><select id="model"></select><button class="ghost" id="exp" title="Bagikan">↗</button></div>
<div id="msgs"><div class="w" id="w"></div></div>
<div class="comp"><div id="att" class="hide"></div><div class="cbox">
<button class="ib" id="att0" title="Lampirkan">📎</button><input type="file" id="fi" class="hide" accept="image/*,.txt,.md,.js,.json,.csv,.py,.html,.css,.lua"><button class="ib" id="mic" title="Suara">🎤</button>
<textarea id="in" rows="1" placeholder="Tulis pesan..."></textarea>
<button class="ib send" id="go">➤</button></div></div>
</section></div>

<div id="md" class="hide"><div class="mb">
<div class="mh">Pengaturan<button id="mx" class="ghost">Tutup</button></div>
<div class="st"><button class="on" data-p="p1">Profil</button><button data-p="p2">Tampilan</button><button data-p="p3">Persona</button><button data-p="p4">Data</button><button data-p="p5">Info</button></div>
<div class="sp" id="p1">
<div class="f"><label>Nama</label><input id="sn"></div>
<div><div class="hint" style="margin-bottom:6px">Warna avatar</div><div class="sw" id="sw"></div></div>
<div class="f"><label>Kata sandi lama</label><input id="po" type="password"></div>
<div class="f"><label>Kata sandi baru</label><input id="pn" type="password"></div>
<button class="btn" id="sv1">Simpan profil</button>
<button class="ghost danger" id="lo">Keluar akun</button></div>
<div class="sp hide" id="p2">
<div class="f"><label>Tema</label><select id="th"><option value="dark">Gelap</option><option value="light">Terang</option><option value="auto">Ikuti sistem</option></select></div>
<div class="f"><label>Ukuran font: <span id="fv"></span>px</label><input id="fz" type="range" min="13" max="19"></div>
<div class="row"><div>Animasi<div class="hint">Matikan untuk performa lebih ringan</div></div><div class="tg" id="an2"></div></div>
<div class="row"><div>Kirim dengan Enter<div class="hint">Shift+Enter untuk baris baru</div></div><div class="tg" id="en"></div></div></div>
<div class="sp hide" id="p3">
<div class="f"><label>Persona</label><select id="pr"></select></div>
<div class="f"><label>Kreativitas: <span id="tv"></span></label><input id="tp" type="range" min="0" max="1.5" step=".1"></div>
<div class="f"><label>Memori (hal yang perlu AI ingat tentang kamu)</label><textarea id="mm" rows="3" placeholder="Contoh: aku developer Roblox, suka jawaban singkat"></textarea></div>
<div class="f"><label>Instruksi kustom</label><textarea id="sy" rows="2" placeholder="Contoh: jawab singkat dan santai"></textarea></div>
<button class="btn" id="sv3">Simpan persona</button></div>
<div class="sp hide" id="p4">
<button class="ghost" id="ea">Ekspor semua data (JSON)</button>
<button class="ghost danger" id="ca">Hapus semua obrolan</button>
<button class="ghost danger" id="da">Hapus akun</button></div>
<div class="sp hide" id="p5">
<div><b>Pemakaian hari ini</b><div class="hint" id="us"></div></div>
<button class="ghost" id="ins">Pasang sebagai aplikasi</button>
<button class="ghost" id="tos">Syarat layanan</button>
<button class="ghost" id="prv">Kebijakan privasi</button>
<div class="hint">Auralis AI v1.1</div></div>
</div></div>
<div id="dc" class="hide"><div class="mb"><div class="mh"><span id="dt"></span><button id="dx" class="ghost">Tutup</button></div><div class="sp" id="db"></div></div></div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},W=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const esc=t=>t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const H=async s=>crypto.subtle?[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join(''):btoa(unescape(encodeURIComponent(s)));
const COL=['#8b7bff','#5eead4','#ff6b8a','#fbbf24','#38bdf8','#fb923c'];
const MODES={
chat:['Chat','Kamu Auralis, asisten AI yang cerdas, jujur, dan ringkas. Jawab dalam bahasa pengguna. Beri jawaban langsung dulu, lalu detail seperlunya. Pakai markdown (judul, daftar, tabel) hanya bila membantu. Jika tidak yakin atau datanya tidak ada, katakan terus terang dan jangan mengarang.'],
code:['Kode','Kamu software engineer senior. Pahami masalahnya dulu, beri kode lengkap yang langsung berjalan dalam blok kode berlabel bahasa, tangani error dan kasus tepi, jangan memotong kode dengan "...". Setelah kode, jelaskan poin penting dan cara mengujinya secara singkat.'],
write:['Tulis','Kamu penulis profesional. Sesuaikan nada dan gaya dengan permintaan, hasilkan teks rapi dan natural siap pakai, lalu tawarkan satu variasi singkat bila relevan.'],
analyze:['Analisis','Kamu analis tajam. Pecah masalah menjadi langkah, bandingkan opsi dengan kelebihan dan kekurangannya (tabel bila cocok), akhiri dengan kesimpulan dan rekomendasi yang jelas.']};
const DEF={theme:'dark',font:15,anim:true,enter:true,temp:.7,sys:'',persona:'default',mem:'',model:'glm-5.3'};
const CFG={limit:50};
/* API key TIDAK ada di sini. Semua key disimpan di server (Vercel env). */
const API=window.AURALIS_API||'/api/chat';let AV={};
async function loadAV(){try{AV=await(await fetch(API)).json()}catch{AV={}}fillModels()}
/* Semua model lewat gateway Dattio (provider 'qwen' = QWEN_API_KEY + QWEN_BASE_URL di server) */
const PROV={qwen:['Dattio AI']};
const MODELS=[
{id:'glm-5.3',n:'GLM 5.3',p:'qwen'},{id:'glm-5.3-flash',n:'GLM 5.3 Flash',p:'qwen'},{id:'glm-5.2',n:'GLM 5.2',p:'qwen'},
{id:'deepseek-v4-flash',n:'DeepSeek V4 Flash',p:'qwen'},{id:'deepseek-v4.1-flash',n:'DeepSeek V4.1 Flash',p:'qwen'},{id:'deepseek-v4-pro',n:'DeepSeek V4 Pro',p:'qwen'},
{id:'claude-opus-5-5',n:'Claude Opus 5.5 (boros token)',p:'qwen',v:1},{id:'claude-sonnet-5-5',n:'Claude Sonnet 5.5',p:'qwen',v:1},
{id:'gpt-5.6',n:'GPT 5.6',p:'qwen',v:1,nt:1},{id:'gpt-5.6-luna',n:'GPT 5.6 Luna',p:'qwen',v:1,nt:1},
{id:'kimi-k3',n:'Kimi K3',p:'qwen'},{id:'kimi-k2.7-code',n:'Kimi K2.7 Code',p:'qwen'},{id:'auto',n:'Auto',p:'qwen'},
{id:'deepseek-v4-flash-vision-exp',n:'DeepSeek Vision (gambar)',p:'qwen',v:1}];

const PER={default:['Default',''],guru:['Guru sabar','Jelaskan seperti guru yang sabar: bertahap dengan contoh sederhana.'],dev:['Programmer','Fokus pada solusi teknis, kode rapi, dan praktik terbaik.'],writer:['Penulis','Gunakan gaya bahasa yang hidup, rapi, dan enak dibaca.'],chill:['Santai','Jawab santai dan singkat, seperti teman.']};
let users=L('ap_users',{}),me=L('ap_me',null),D,cur=null,busy=false,stopped=false,ctl=null,amode='in';
const save=()=>{try{W('ap_d_'+me,D)}catch{toast('Penyimpanan penuh, hapus obrolan lama')}},U=()=>users[me],S=()=>D.set;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}

/* AUTH */
$$('.tabs button').forEach(b=>b.onclick=()=>{amode=b.dataset.m;$$('.tabs button').forEach(x=>x.classList.toggle('on',x==b));$$('.up').forEach(x=>x.classList.toggle('hide',amode=='in'));$('#asub').textContent=amode=='in'?'Masuk':'Buat akun';$('#aerr').textContent=''});
$('#eye').onclick=()=>{const p=$('#ap');p.type=p.type=='password'?'text':'password';$('#eye').textContent=p.type=='text'?'Sembunyi':'Lihat'};
async function auth(){
 const e=$('#ae').value.trim().toLowerCase(),p=$('#ap').value,er=m=>$('#aerr').textContent=m;
 if(!/^\S+@\S+\.\S+$/.test(e))return er('Format email belum benar.');
 if(p.length<6)return er('Kata sandi minimal 6 karakter.');
 if(amode=='up'){
  const n=$('#an').value.trim();if(!n)return er('Isi nama kamu.');
  if(p!==$('#ap2').value)return er('Kata sandi tidak sama.');
  if(users[e])return er('Email sudah terdaftar. Silakan masuk.');
  users[e]={name:n,hash:await H(e+':'+p),color:COL[0]};W('ap_users',users);
 }else{
  if(!users[e]||users[e].hash!==await H(e+':'+p))return er('Email atau kata sandi salah.');
 }
 me=e;W('ap_me',me);boot();
}
$('#asub').onclick=auth;$('#auth').addEventListener('keydown',e=>{if(e.key=='Enter')auth()});

/* BOOT */
function boot(){
 if(!me||!users[me]){me=null;$('#auth').classList.remove('hide');$('#app').classList.add('hide');return}
 D=L('ap_d_'+me,{chats:[],set:{}});D.set={...DEF,...D.set};
 $('#auth').classList.add('hide');$('#app').classList.remove('hide');
 $('#mode').innerHTML=Object.entries(MODES).map(([k,v])=>`<option value=${k}>${v[0]}</option>`).join('');
 fillModels();loadAV();skin();prof();cur=null;drawList();drawMsgs();
}

/* RENDER: markdown (tabel, daftar bernomor, tautan, miring, kutipan, blok kode + Unduh) */
function md(t){
 const B=[];
 t=t.replace(/```(\w*)\n?([\s\S]*?)(```|$)/g,(m,l,c)=>{B.push(`<div class="code"><div class="ch"><span>${l||'kode'}</span><span><button data-dl="${l||'txt'}">Unduh</button> <button data-cp>Salin</button></span></div><pre>${esc(c)}</pre></div>`);return '\0'+(B.length-1)+'\0'});
 const ln=s=>s.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<i>$2</i>').replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
 const R=esc(t).split('\n'),o=[],tb=x=>/^\|.+\|$/.test((x||'').trim());let i=0,m;
 while(i<R.length){
  const l=R[i];
  if(tb(l)&&/^\|[\s:|-]+\|$/.test((R[i+1]||'').trim())){
   const rows=[];while(i<R.length&&tb(R[i])){rows.push(R[i]);i++}
   const c=r=>r.trim().slice(1,-1).split('|').map(x=>ln(x.trim()));
   o.push('<div style="overflow:auto"><table><tr>'+c(rows[0]).map(x=>`<th>${x}</th>`).join('')+'</tr>'+rows.slice(2).map(r=>'<tr>'+c(r).map(x=>`<td>${x}</td>`).join('')+'</tr>').join('')+'</table></div>');continue}
  if(/^\0\d+\0$/.test(l))o.push(l);
  else if(m=l.match(/^#{1,3} (.+)$/))o.push('<h4>'+ln(m[1])+'</h4>');
  else if(/^([-*]|\d+\.) /.test(l)){
   const ord=/^\d+\. /.test(l),re=ord?/^\d+\. /:/^[-*] /,it=[];
   while(i<R.length&&re.test(R[i])){it.push('<li>'+ln(R[i].replace(/^([-*]|\d+\.) /,''))+'</li>');i++}
   o.push((ord?'<ol>':'<ul>')+it.join('')+(ord?'</ol>':'</ul>'));continue}
  else if(/^&gt; /.test(l))o.push('<blockquote>'+ln(l.slice(5))+'</blockquote>');
  else if(/^---+$/.test(l.trim()))o.push('<hr>');
  else o.push(ln(l)+'<br>');
  i++}
 return o.join('').replace(/\0(\d+)\0/g,(x,k)=>B[k])}

/* AI */
async function ask(onTok){
 const s=S(),sys=MODES[cur.mode][1]+(PER[s.persona]&&PER[s.persona][1]?'\n'+PER[s.persona][1]:'')+(s.mem?'\nInfo tentang pengguna: '+s.mem:'')+(s.sys?'\n'+s.sys:''),ms=cur.msgs.slice(-20);
 let vi=-1;ms.forEach((m,i)=>{if(m.img)vi=i});
 let m=MODELS.find(x=>x.id==s.model)||MODELS[0];
 if(vi>=0&&!m.v){const f=MODELS.find(x=>x.v&&AV[x.p]);if(f){m=f;toast('Gambar dianalisis dengan '+f.n)}}
 const part=u=>({type:'image_url',image_url:{url:u}});
 const h=ms.map((x,i)=>({role:x.r,content:x.img?(i==vi?[{type:'text',text:x.c},part(x.img)]:x.c+' [gambar]'):x.c}));
 const body={model:m.id,stream:true};
 if(!m.nt)body.temperature=s.temp;
 body.messages=[{role:'system',content:sys},...h];
 const r=await fetch(API,{method:'POST',signal:ctl.signal,headers:{'content-type':'application/json'},body:JSON.stringify({p:m.p,body})});
 if(!r.ok){let e='Permintaan gagal ('+r.status+')';try{e=(await r.json()).error?.message||e}catch{}throw Error(e)}
 const rd=r.body.getReader(),dc=new TextDecoder();let buf='',out='';
 for(;;){const{done,value}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop();
  for(const l of ls){if(!l.startsWith('data:'))continue;const d=l.slice(5).trim();if(d=='[DONE]')continue;try{const j=JSON.parse(d),t=j.choices?j.choices[0]?.delta?.content:(j.type=='content_block_delta'?j.delta.text:'');if(t){out+=t;onTok(out)}}catch{}}}
 return out}
function busyUI(v){busy=v;$('#go').textContent=v?'■':'➤'}
async function reply(){
 busyUI(true);stopped=false;ctl=new AbortController();
 $$('[data-a=rg]').forEach(x=>x.remove());
 const b=bub('assistant','',1);b.innerHTML='<div class="dots"><i></i><i></i><i></i></div>';stick();
 let out='',raf=0;const paint=()=>{raf=0;b.innerHTML=md(out);stick()};
 try{await ask(t=>{out=t;if(!raf)raf=requestAnimationFrame(paint)})}catch(e){if(e.name!='AbortError')out+=(out?'\n\n':'')+'⚠️ '+(e.message=='Failed to fetch'?'Tidak bisa terhubung ke server. Periksa koneksi internet.':e.message)}
 if(raf)cancelAnimationFrame(raf);
 if(out){cur.msgs.push({r:'assistant',c:out});cur.t=Date.now();b.innerHTML=md(out);acts(b,true);b.closest('.m').dataset.i=cur.msgs.length-1}else b.closest('.m').remove();
 save();busyUI(false);drawList()}

 let img=null;

 usage(1);att=null;$('#att').className='hide';
 $('#in').value='';$('#in').style.height='auto';save();drawList();if(cur.msgs.length==1)$('#w').innerHTML='';
 acts(bub('user',t,1,img,cur.msgs.length-1),0,1);stick();reply()}
