<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Auralis AI</title>
<meta name="description" content="Auralis AI: asisten AI pribadi untuk kode, tulisan, dan analisis."><meta name="theme-color" content="#0b161c"><meta property="og:title" content="Auralis AI"><meta property="og:description" content="Asisten AI pribadi untuk kode, tulisan, dan analisis."><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Lora:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Nunito:wght@400;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b161c;--s1:#102029;--s2:#172c37;--bd:#264452;--tx:#e9efe8;--mu:#8fa7ad;--ac:#f0b24a;--ac2:#7cc4d4;--ac3:#d99a2b;--er:#ff7a6b;--onac:#1b1405;--fs:15px;--lh:1.55;--ff:"Atkinson Hyperlegible",system-ui,sans-serif;--rf:Newsreader,Georgia,serif;--cf:"JetBrains Mono",ui-monospace,Menlo,monospace;--mw:780px}
[data-t=light]{--bg:#eef3f1;--s1:#fff;--s2:#e1ebe8;--bd:#c6d8d3;--tx:#10242b;--mu:#566f76;--ac:#c27d0b;--ac2:#14788c;--ac3:#a8690a;--er:#c93d2e}
[data-t=amoled]{--bg:#000;--s1:#070f13;--s2:#0f1c23;--bd:#1b323d}
[data-acc=ocean]{--ac:#38bdf8;--ac2:#34d399;--ac3:#0ea5e9}
[data-acc=rose]{--ac:#fb7185;--ac2:#fbbf24;--ac3:#e11d48}
[data-acc=forest]{--ac:#4ade80;--ac2:#2dd4bf;--ac3:#16a34a}
[data-acc=sunset]{--ac:#fb923c;--ac2:#f472b6;--ac3:#ea580c}
[data-acc=mono]{--ac:#a1a1aa;--ac2:#e4e4e7;--ac3:#71717a}
[data-d=compact] .m{margin-bottom:12px}[data-d=cozy] .m{margin-bottom:30px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:var(--fs)/var(--lh) var(--ff);background:var(--bg);color:var(--tx);overflow:hidden;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);transition:background-color .4s,color .4s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.noanim *,.noanim *::before,.noanim *::after{animation:none!important;transition:none!important}
.soft .orb,.soft .amb i,.soft .logo i,.soft .caret,.soft .send.has,.soft .pill.pom{animation:none!important}
.hide{display:none!important}
input,select,textarea{background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:11px 13px;width:100%;outline:0;transition:border-color .2s,background-color .4s}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
.btn,.ib,.ghost{position:relative;overflow:hidden}
.btn{background:var(--ac);color:var(--onac);padding:12px 18px;border-radius:12px;font-weight:700;transition:transform .15s,filter .2s}
.btn:active{transform:scale(.97)}.btn:hover{filter:brightness(1.1)}.btn.sm{padding:7px 13px;font-size:.88em}
.ghost{background:var(--s2);border:1px solid var(--bd);padding:9px 14px;border-radius:10px;transition:border-color .2s,transform .15s,background-color .3s}
.ghost:hover{border-color:var(--ac)}.ghost:active{transform:scale(.97)}
.danger{color:var(--er)}
.rp{position:absolute;border-radius:50%;background:#fff4;transform:scale(0);animation:rpl .6s ease-out forwards;pointer-events:none}
@keyframes rpl{to{transform:scale(1);opacity:0}}
.hint{font-size:.8em;color:var(--mu)}
.plan{font-size:.68em;font-weight:700;padding:1px 8px;border-radius:99px;border:1px solid var(--ac);color:var(--ac);margin-left:6px;vertical-align:middle;font-style:normal}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-size:.68em;padding:2px 8px;border-radius:99px;background:var(--s1);border:1px solid var(--bd);color:var(--ac2);white-space:nowrap}
/* auth */
#auth{position:fixed;inset:0;display:grid;place-items:center;padding:20px;overflow:auto}
.orb{position:fixed;pointer-events:none;border-radius:50%}
.o1{width:90vmax;height:46vmax;left:50%;bottom:-34vmax;transform:translateX(-50%);background:radial-gradient(ellipse,var(--ac),transparent 62%);opacity:.2}.o2{display:none}
@keyframes drift{to{transform:translate3d(8vmax,6vmax,0) scale(1.15)}}
.card{position:relative;width:min(400px,100%);background:var(--s1);border:1px solid var(--bd);border-radius:22px;padding:28px;animation:rise .7s cubic-bezier(.2,.9,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}}
.logo{display:flex;align-items:center;gap:11px;font-family:var(--rf);font-weight:600;font-size:1.4em;letter-spacing:-.015em;margin-bottom:6px}.logo em{font:normal 600 .5em var(--ff);color:var(--mu);margin:.5em 0 0 -4px;letter-spacing:.02em}
.logo i,.lamp{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 36% 33%,#ffe6ad 0,var(--ac) 46%,#8f5c0d 100%);box-shadow:0 0 18px 2px color-mix(in srgb,var(--ac) 50%,transparent);display:block;flex:none;animation:breathe 5s ease-in-out infinite}@keyframes breathe{50%{box-shadow:0 0 28px 6px color-mix(in srgb,var(--ac) 68%,transparent)}}
@keyframes spin{to{transform:rotate(360deg)}}
.sub{color:var(--mu);font-size:.9em;margin-bottom:18px}
.tabs{display:flex;background:var(--s2);border-radius:12px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;padding:8px;border-radius:9px;color:var(--mu);transition:.2s}
.tabs .on{background:var(--s1);color:var(--tx);box-shadow:0 2px 8px #0003}
.f{margin-bottom:12px;position:relative}.f label{font-size:.8em;color:var(--mu);display:block;margin-bottom:5px}
.eye{position:absolute;right:8px;bottom:6px;padding:6px;color:var(--mu);font-size:.8em}
.err{color:var(--er);font-size:.85em;min-height:1.3em;margin-bottom:8px}
/* app */
#app{display:flex;height:100%}
#side{width:300px;background:var(--s1);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:14px;gap:10px;transition:transform .3s cubic-bezier(.2,.9,.3,1),background-color .4s;z-index:20;min-height:0}
.sh{display:flex;align-items:center;gap:8px}.sh .logo{flex:1;margin:0}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--mu);transition:background-color .2s,color .2s}
.ib:hover{background:var(--s2);color:var(--tx)}.ib.sm{width:34px;height:34px;font-size:.95em}
.stabs{position:relative;display:grid;grid-template-columns:repeat(4,1fr);background:var(--s2);border-radius:12px;padding:4px}
.stabs::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/4);background:var(--s1);border-radius:9px;box-shadow:0 2px 8px #0003;transform:translateX(calc(var(--ti,0)*100%));transition:transform .4s cubic-bezier(.3,1.3,.5,1)}
.stabs button{position:relative;padding:7px 2px;border-radius:9px;color:var(--mu);font-size:.72em;display:flex;flex-direction:column;align-items:center;gap:1px;transition:color .2s}
.stabs button b{font-size:1.35em;font-weight:500;line-height:1.2}.stabs .on{color:var(--tx)}
#sact button{width:100%}
#list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px;margin:0 -4px;padding:0 4px;min-height:0}
.gh{font-size:.76em;font-weight:700;color:var(--mu);padding:12px 8px 3px}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}}
.ci{display:flex;align-items:center;gap:6px;padding:10px 12px;border-radius:11px;color:var(--mu);cursor:pointer;transition:background-color .15s,color .15s;animation:slide .35s both;animation-delay:calc(var(--i,0)*28ms)}
.ci span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ci em{font-style:normal;font-size:.8em}
.ci:hover{background:var(--s2)}.ci.on{background:var(--s2);color:var(--tx);box-shadow:inset 3px 0 var(--ac)}
.ci b{opacity:0;padding:0 3px;font-weight:400;transition:opacity .15s}.ci:hover b,.ci.on b{opacity:1}
@media(hover:none){.ci b{opacity:.55}}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.sc{background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;animation:slide .35s both;animation-delay:calc(var(--i,0)*28ms);transition:border-color .2s,transform .2s}
.sc:hover{border-color:var(--ac);transform:translateY(-1px)}
.sc pre{padding:0;max-height:3.4em;overflow:hidden;font-size:.72em;color:var(--mu);white-space:pre-wrap}
.sc .nm{font-weight:600;display:flex;align-items:center;gap:8px}
.lf{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.lf button{padding:3px 10px;border-radius:99px;border:1px solid var(--bd);font-size:.72em;color:var(--mu);transition:.2s}
.lf .on{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.pjb{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;font-size:.85em;margin-bottom:4px}.pjb span{flex:1}
.me{display:flex;align-items:center;gap:8px;padding:10px;border-radius:12px;background:var(--s2)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;flex:none}
.me div:nth-child(2){flex:1;min-width:0}.me small{color:var(--mu);display:block;overflow:hidden;text-overflow:ellipsis}
#main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#main>*{position:relative;z-index:1}
#main>.amb{position:absolute;z-index:0}
.amb{inset:0;overflow:hidden;pointer-events:none}
.amb i{position:absolute;border-radius:50%}
.amb i:nth-child(1){width:84vmax;height:34vmax;left:50%;bottom:-22vmax;transform:translateX(-50%);background:radial-gradient(ellipse,var(--ac),transparent 65%);opacity:.06;transition:opacity 1.4s}.busy .amb i:nth-child(1){opacity:.17}
.amb i:nth-child(2){display:none}
.nobg .amb{display:none}
.top{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--bd);transition:border-color .3s}
.top h1{font-size:1em;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.top select{width:auto;padding:8px;max-width:130px;text-overflow:ellipsis}
#menu{display:none;font-size:1.3em;padding:4px 8px}
#sub{display:flex;gap:8px;padding:7px 16px;overflow:auto;border-bottom:1px solid var(--bd)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.76em;padding:4px 11px;border-radius:99px;background:var(--s2);border:1px solid var(--bd);color:var(--mu);white-space:nowrap;cursor:default;animation:rise .3s}
.pill[data-do]{cursor:pointer}
.pill.pom{color:var(--ac2);border-color:var(--ac2);animation:glow2 2.4s ease-in-out infinite}
@keyframes glow2{50%{box-shadow:0 0 14px -2px var(--ac2)}}
#msgs{flex:1;overflow:auto;padding:20px 16px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.w{max-width:var(--mw);margin:0 auto;transition:max-width .4s}
.m{display:flex;margin-bottom:26px;contain:layout style}
.m.new{animation:in .45s cubic-bezier(.2,1.1,.3,1)}.m.u.new{animation-name:inr}
@keyframes in{from{opacity:0;transform:translateY(12px) scale(.98)}}
@keyframes inr{from{opacity:0;transform:translate(16px,8px) scale(.96)}}
.m .av{display:none}
.m.u{flex-direction:row-reverse}.m.u .b{background:var(--s2);border:1px solid var(--bd);padding:9px 14px;border-radius:14px 14px 3px 14px;max-width:min(88%,580px)}
.m.a{position:relative;padding-left:22px}.m.a::before{content:"";position:absolute;left:3px;top:1.5em;bottom:2px;width:1px;background:var(--bd)}.m.a::after{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--ac);box-shadow:0 0 10px var(--ac)}
.m.a .bc{font-family:var(--rf);font-size:1.07em;line-height:1.68}[data-rf=ui] .m.a .bc{font-family:inherit;font-size:1em;line-height:inherit}
.b{min-width:0;overflow-wrap:anywhere;max-width:100%}
.ts{font-size:.68em;color:var(--mu);margin-top:4px}.nots .ts{display:none}
.dsep{display:flex;align-items:center;gap:12px;color:var(--mu);font-size:.72em;margin:4px 0 18px;animation:rise .4s}
.dsep::before,.dsep::after{content:"";flex:1;height:1px;background:var(--bd)}
.acts{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}.acts button{color:var(--mu);font-size:.78em;padding:3px 8px;border-radius:8px;transition:.15s}.acts button:hover{background:var(--s2);color:var(--tx)}
.b h4{font-family:var(--rf);font-size:1.18em;font-weight:600;margin:16px 0 4px}.b ul,.b ol{padding-left:22px}
.b a{color:var(--ac2)}.b table{border-collapse:collapse;margin:8px 0;font-size:.9em}.b th,.b td{border:1px solid var(--bd);padding:6px 10px}.b th{background:var(--s2)}
.b blockquote{border-left:3px solid var(--ac);padding-left:10px;color:var(--mu)}.b hr{border:0;border-top:1px solid var(--bd);margin:10px 0}
.b code{background:var(--s2);padding:1px 6px;border-radius:6px;font:.86em var(--cf)}
.code{background:#08121a;border:1px solid var(--bd);border-radius:10px;margin:10px 0;overflow:hidden;font-family:var(--cf)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 12px;background:#0d1c26;color:#8fa7ad;font-size:.78em}
.ch span:last-child{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.ch button{color:var(--ac2);transition:transform .15s}.ch button:active{transform:scale(.9)}
pre{padding:12px;overflow:auto;font:.84em/1.55 var(--cf);color:#e3ece6}
.k-c{color:#7f7ba8;font-style:italic}.k-s{color:#a5f3c4}.k-n{color:#fbbf77}.k-k{color:#c4b5fd}.k-t{color:#7dd3fc}.k-f{color:#fcd34d}
.caret{display:inline-block;width:3px;height:1.05em;background:var(--ac);border-radius:2px;vertical-align:text-bottom;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.dots{display:inline-flex;align-items:center;padding:6px 0}.dots i{width:9px;height:9px;border-radius:50%;background:var(--ac);box-shadow:0 0 12px var(--ac);animation:lampp 1.5s ease-in-out infinite}
.dots i:nth-child(n+2){display:none}@keyframes lampp{0%,100%{transform:scale(.7);opacity:.55}50%{transform:scale(1.2);opacity:1}}
@keyframes bn{50%{transform:translateY(-6px);opacity:.4}}
.empty{text-align:left;padding:9vh 0 0;max-width:580px;margin:0 auto}.empty .lamp{width:30px;height:30px}.empty h2{font-family:var(--rf);font-weight:500;font-size:2.35em;line-height:1.1;letter-spacing:-.02em;margin:22px 0 10px}
.empty p{color:var(--mu);margin:0}
.grad{background:linear-gradient(90deg,var(--tx),var(--ac),var(--ac2),var(--tx));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;text-align:left}
.chips button{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:13px;transition:border-color .2s,transform .2s;animation:rise .5s both;animation-delay:calc(var(--i,0)*80ms + .15s)}
.chips button:hover{border-color:var(--ac);transform:translateY(-3px)}
.pic{max-width:min(220px,100%);border-radius:12px;display:block;margin-bottom:6px}
.chip{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--bd);border-radius:12px;padding:7px 12px;font-size:.84em;margin:0 auto 8px;max-width:var(--mw)}
.chip button{color:var(--mu)}
.comp{padding:10px 16px 14px;position:relative}
.cbox{max-width:var(--mw);margin:0 auto;display:flex;gap:8px;align-items:flex-end;background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:8px;transition:border-color .2s,box-shadow .3s,background-color .4s}
.cbox:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 20%,transparent)}
.cbox textarea{border:0;background:none;resize:none;max-height:360px;padding:9px;overflow-y:hidden;scrollbar-width:thin}
.ib.rec{color:var(--er);animation:bn .8s infinite}
.send{background:var(--ac);color:var(--onac)}.send:hover{color:var(--onac);background:var(--ac);filter:brightness(1.08)}
.send.has{animation:glow 2s ease-in-out infinite}.send.stop{background:var(--er);animation:none}
@keyframes glow{50%{box-shadow:0 0 18px var(--ac)}}
#slash{position:absolute;left:16px;right:16px;bottom:calc(100% - 6px);max-width:var(--mw);margin:0 auto;background:var(--s1);border:1px solid var(--bd);border-radius:14px;overflow:hidden;box-shadow:0 -10px 30px #0005;animation:rise .2s;z-index:5}
#slash button{display:flex;gap:10px;width:100%;text-align:left;padding:9px 14px;align-items:baseline}
#slash button span{color:var(--mu);font-size:.85em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#slash .on,#slash button:hover{background:var(--s2)}
#main>#down{position:absolute;bottom:92px;right:22px;width:38px;height:38px;border-radius:50%;background:var(--s1);border:1px solid var(--bd);box-shadow:0 6px 20px #0004;z-index:6;animation:rise .25s;color:var(--tx)}
/* modal */
.ov{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:14px;z-index:50;animation:fade .2s;backdrop-filter:blur(4px)}
.ov.pt{align-items:start;padding-top:11vh}
@keyframes fade{from{opacity:0}}@keyframes fadeo{to{opacity:0}}
.ov.out{animation:fadeo .18s forwards}.ov.out .mb{animation:pop .18s reverse forwards}
.mb{background:var(--s1);border:1px solid var(--bd);border-radius:20px;width:min(560px,100%);max-height:90dvh;display:flex;flex-direction:column;animation:pop .35s cubic-bezier(.2,1.2,.4,1);overflow:hidden}
.mb.wide{width:min(820px,100%);height:min(86dvh,720px)}.mb.full{width:min(1100px,100%);height:90dvh}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.94)}}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px;font-weight:600;border-bottom:1px solid var(--bd)}
.mh input{background:none;border:0;font-weight:600;padding:0;min-width:0;flex:1}.mh input:focus{border:0}
.mbd{padding:18px 20px;overflow:auto;display:flex;flex-direction:column;gap:12px;min-height:0}
.sg{display:flex;flex:1;min-height:0}
.rail{width:172px;border-right:1px solid var(--bd);padding:10px;display:flex;flex-direction:column;gap:2px;overflow:auto;flex:none}
.rail button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:11px;color:var(--mu);text-align:left;transition:.2s}
.rail button i{font-style:normal;width:20px;text-align:center}
.rail button:hover{background:var(--s2)}.rail .on{background:var(--s2);color:var(--tx);box-shadow:inset 3px 0 var(--ac)}
.pane{flex:1;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0;animation:fade .25s}
.pane h3{font-size:1.1em}
.grp{background:var(--s2);border:1px solid var(--bd);border-radius:14px;padding:2px 14px}
.fr{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--bd)}.fr:last-child{border:0}
.fr>div:first-child{min-width:0;flex:1}.fr .ctl{flex:none;display:flex;align-items:center;gap:8px;max-width:58%}
.fr select,.fr input[type=time]{width:auto;min-width:130px;padding:8px 10px;background:var(--s1)}
.fr.col{flex-direction:column;align-items:stretch;gap:8px}.fr.col .ctl{max-width:none;width:100%}.fr.col textarea{background:var(--s1)}
input[type=range]{padding:0;accent-color:var(--ac);background:none;border:0;width:150px}
.pvw{background:var(--s2);border:1px solid var(--bd);border-radius:14px;padding:14px}

 kn();pc();lab()}

const gv=k=>k.split('.').reduce((o,x)=>o&&o[x],S());
const sv=(k,v)=>{const p=k.split('.');let o=S();while(p.length>1)o=o[p.shift()];o[p[0]]=v};
const persist=()=>{clearTimeout(persist.t);persist.t=setTimeout(save,250)};
const fr=(t,h,c,cls)=>`<div class="fr ${cls||''}"><div>${t}${h?`<div class="hint">${h}</div>`:''}</div><div class="ctl">${c}</div></div>`;
const T=(k,t,h)=>fr(t,h,`<div class="tg ${gv(k)?'on':''}" data-tg="${k}" role="switch" tabindex="0" aria-checked="${!!gv(k)}"></div>`);
const SEL=(k,t,opts,h,n)=>fr(t,h,`<select data-k="${k}" ${n?'data-n="1"':''}>${opts.map(([v,l])=>`<option value="${esc(v)}" ${String(gv(k))==String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select>`);
const RNG=(k,t,mn,mx,st,u,h)=>fr(t,h,`<input type="range" data-k="${k}" data-u="${u||''}" min="${mn}" max="${mx}" step="${st}" value="${gv(k)}"><span class="hint" data-o="${k}" style="min-width:46px;text-align:right">${gv(k)}${u||''}</span>`);
const BTN=(d,t,c)=>`<button class="ghost ${c||''}" data-do="${d}">${t}</button>`;
const RER=new Set(['qh','nt']);
function skinKeys(){skin();prof()}
function applyKey(k,v,how){
 skin();
 if(['tz','h24','ts','dsep'].includes(k)){if(!busy)drawMsgs();side()}
 if(k=='clk'||k=='tmp')drawSub(1);
 if(k=='hmail')prof();
 if(k=='hidblur')hb();
 if(k=='del'){purge();save();side()}
 if(k=='nt'&&v)askNotif(true);
 if((k=='sndk'||k=='vol')&&how=='change')ping();
 if(k=='snd'&&v)ping();
 if(RER.has(k)&&PANE&&PANE.isConnected)renderPane()}
function setKey(k,v,how){
 if(k=='focus'){setFocus(v);return}
 sv(k,v);save();applyKey(k,v,how)}
function bindSettings(root,rerender){
 const flip=el=>{const k=el.dataset.tg,v=!gv(k);setKey(k,v);el.classList.toggle('on',v);el.setAttribute('aria-checked',v)};
 root.addEventListener('click',e=>{
  const t=e.target,tg=t.closest('[data-tg]');if(tg){flip(tg);return}
  const ac=t.closest('[data-sw]');if(ac){S().acc=ac.dataset.sw;save();skin();root.querySelectorAll('[data-sw]').forEach(x=>x.classList.toggle('on',x==ac));return}
  const sc=t.closest('.sw [data-c]');if(sc){sc.parentNode.querySelectorAll('i').forEach(x=>x.classList.toggle('on',x==sc));return}
  const dd=t.closest('[data-do]');if(dd)act(dd.dataset.do,dd,root)});
 root.addEventListener('keydown',e=>{const tg=e.target.closest&&e.target.closest('[data-tg]');if(tg&&(e.key==' '||e.key=='Enter')){e.preventDefault();flip(tg)}});
 root.addEventListener('change',e=>{const el=e.target.closest('[data-k]');if(!el)return;let v=el.value;if(el.dataset.n)v=+v;setKey(el.dataset.k,v,'change')});
 root.addEventListener('input',e=>{const el=e.target.closest('[data-k]');if(!el||el.type!='range')return;const v=+el.value,k=el.dataset.k;sv(k,v);const o=root.querySelector(`[data-o="${k}"]`);if(o)o.textContent=v+(el.dataset.u||'');applyKey(k,v,'input');persist()})}

 let raw;try{raw=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(2,14)},SY.keys.aes,u.slice(14)))}catch{throw Error('Data tidak bisa dibuka (kode salah atau data rusak)')}
 if(u[1])raw=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
 return JSON.parse(new TextDecoder().decode(raw))}
async function syFetch(method,qs,body){
 const r=await fetch(SYAPI+(qs||''),{method,headers:{'content-type':'application/json',...LH()},body:body?JSON.stringify(body):undefined});
 let j={};try{j=await r.json()}catch{}
 if(!r.ok){const e=Error((j.error&&j.error.message)||'Server '+r.status);e.status=r.status;throw e}
 return j}
function syPayload(){
 const strip=c=>({...c,msgs:c.msgs.map(m=>{if(m.img)m={...m,img:null};if(m.gen&&m.gen.u&&String(m.gen.u).startsWith('data:'))m={...m,gen:{...m.gen,u:null}};return m})});
 return{ver:1,t:Date.now(),chats:D.chats.filter(c=>!c.tmp).map(strip),proj:D.proj,arts:D.arts,snip:D.snip,mems:D.mems||[],prm:D.prm||[],stats:D.stats||{},tomb:D.tomb||{}}}
function syMerge(r){
 SY.merging=true;
 try{
  const old=Date.now()-90*864e5,tb={...(D.tomb||{})};
  for(const[k,v]of Object.entries(r.tomb||{}))tb[k]=Math.max(tb[k]||0,v);
  for(const k in tb)if(tb[k]<old)delete tb[k];
  const mg=(loc,rem,pre)=>{
   const m=new Map((loc||[]).map(x=>[x.id,x]));
   for(const x of rem||[]){
    if(!x||x.id==null)continue;const l=m.get(x.id);
    if(!l||(x.t||0)>(l.t||0)){
     if(l&&pre=='c')x.msgs.forEach((g,i)=>{const lm=l.msgs[i];if(lm&&lm.img&&lm.t==g.t&&!g.img)g.img=lm.img});
     m.set(x.id,x)}}
   return[...m.values()].filter(x=>!(tb[pre+x.id]>(x.t||x.id||0)))};
  D.chats=mg(D.chats,r.chats,'c');D.proj=mg(D.proj,r.proj,'p');D.arts=mg(D.arts,r.arts,'a');D.snip=mg(D.snip,r.snip,'s');D.mems=mg(D.mems,r.mems,'m');
  const pm=new Map((D.prm||[]).map(p=>[p.n,p]));(r.prm||[]).forEach(p=>{if(p&&p.n&&!pm.has(p.n))pm.set(p.n,p)});D.prm=[...pm.values()];
  D.stats=D.stats||{};for(const[k,v]of Object.entries(r.stats||{}))D.stats[k]=Math.max(D.stats[k]||0,v);
  D.tomb=tb;if(D.act&&!D.proj.find(p=>p.id==D.act))D.act=null;
  purge();save()}
 finally{SY.merging=false}}

async function syRun(){
 if(!SY.on||!SY.keys||SY.busy||!D)return;
 if(!isPro()){setSt('Sinkron dijeda: perlu Pro');return}
 if(busy){schedSync(3000);return}
 SY.busy=true;setSt('Menyinkronkan...');
 try{
  let done=false;
  for(let n=0;n<3&&!done;n++){
   const g=await syFetch('GET','?id='+SY.keys.id);
   if(g.v>0&&g.d)syMerge(await syUnpack(g.d));
   const d=await syPack(syPayload());
   if(d.length>symax())throw Error('Data terlalu besar ('+Math.round(d.length/1024)+' KB dari batas '+Math.round(symax()/1000)+' KB). Hapus obrolan lama atau minta penjual menambah penyimpanan.');
   try{const j=await syFetch('POST','',{id:SY.keys.id,ws:SY.keys.ws,d,v:g.v});SY.v=j.v;done=true}
   catch(e){if(e.status!=409)throw e}}
  if(!done)throw Error('Data berubah terus, coba lagi nanti');
  SY.last=Date.now();W(syKey()+'_t',SY.last);setSt('');syRefresh()}
 catch(e){setSt('Gagal: '+(e.message=='Failed to fetch'?'tidak ada koneksi':e.message))}
 finally{SY.busy=false;if(PANE&&PANE.isConnected&&SECID=='sinkron')renderPane()}}

const LP={};
function loadLib(k){
 if(LIBS[k][1]())return Promise.resolve(LIBS[k][1]());
 if(LP[k])return LP[k];
 LP[k]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=LIBS[k][0];s.onload=()=>res(LIBS[k][1]());s.onerror=()=>{LP[k]=null;rej(Error('Gagal memuat pustaka pembaca berkas. Periksa koneksi internet.'))};document.head.appendChild(s)});

const LIMD=24000,MAXATT=5;
const decXml=s=>s.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#(\d+);/g,(m,n)=>String.fromCharCode(+n)).replace(/&amp;/g,'&');
async function readDoc(f){
 const n=f.name.toLowerCase();let text='',extra='';
 if(/\.pdf$/.test(n)||f.type=='application/pdf'){
  if(f.size>15e6)throw Error('PDF terlalu besar (maks 15 MB)');
  const lib=await loadLib('pdfjs');lib.GlobalWorkerOptions.workerSrc=LIBS.pdfjs[0].replace('pdf.min.js','pdf.worker.min.js');
  const pdf=await lib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise,pages=Math.min(pdf.numPages,80);
  for(let i=1;i<=pages&&text.length<LIMD*1.5;i++){const pg=await pdf.getPage(i),c=await pg.getTextContent();let line='';c.items.forEach(it=>{line+=it.str+(it.hasEOL?'\n':' ')});text+=(pdf.numPages>1?'\n--- Halaman '+i+' ---\n':'')+line.replace(/[ \t]+\n/g,'\n')}
  if(text.replace(/--- Halaman \d+ ---|\s/g,'').length<20)throw Error('PDF tidak berisi teks (mungkin hasil pindai)');
  if(pdf.numPages>pages)extra=pages+' dari '+pdf.numPages+' halaman'}
 else if(/\.(docx|pptx)$/.test(n)){
  if(f.size>15e6)throw Error('Berkas terlalu besar (maks 15 MB)');
  const Z=await loadLib('jszip'),z=await Z.loadAsync(await f.arrayBuffer());
  if(/\.docx$/.test(n)){const x=z.file('word/document.xml');if(!x)throw Error('Berkas Word tidak valid');text=decXml((await x.async('string')).replace(/<\/w:p>/g,'\n').replace(/<w:tab\/>/g,'\t').replace(/<w:br\/>/g,'\n').replace(/<[^>]+>/g,''))}
  else{const sl=Object.keys(z.files).map(k=>[k,k.match(/^ppt\/slides\/slide(\d+)\.xml$/)]).filter(x=>x[1]).sort((a,b)=>a[1][1]-b[1][1]);if(!sl.length)throw Error('Berkas PowerPoint tidak valid');
   for(const[k,m]of sl)text+='\n--- Slide '+m[1]+' ---\n'+decXml((await z.file(k).async('string')).replace(/<\/a:p>/g,'\n').replace(/<[^>]+>/g,''))}}
 else if(/\.(xlsx|xls|ods)$/.test(n)){
  if(f.size>15e6)throw Error('Berkas terlalu besar (maks 15 MB)');
  const X=await loadLib('xlsx'),wb=X.read(new Uint8Array(await f.arrayBuffer()),{type:'array'});
  wb.SheetNames.forEach(s=>{text+='\n--- Sheet: '+s+' ---\n'+X.utils.sheet_to_csv(wb.Sheets[s])})}

  if(f.size>2e6)throw Error('Berkas teks terlalu besar (maks 2 MB)');
  text=await f.text();if(text.indexOf('\u0000')>=0)throw Error('Format berkas ini belum didukung')}
 text=text.replace(/\n{3,}/g,'\n\n').trim();
 if(!text)throw Error('Berkas kosong atau tidak berisi teks');
 let note=extra;
 if(text.length>LIMD){note=(note?note+', ':'')+'dipotong '+Math.round(LIMD/1000)+' dari '+Math.round(text.length/1000)+' rb karakter';text=text.slice(0,LIMD)}
 return{text,note}}
function readImg(f){return new Promise((res,rej)=>{

 const draw=(src,w,h)=>{try{const k=Math.min(1,1024/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(src,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))}catch(e){bad()}};

 im.onload=()=>{URL.revokeObjectURL(u);draw(im,im.naturalWidth||im.width,im.naturalHeight||im.height)};
 im.onerror=()=>{URL.revokeObjectURL(u);if(!window.createImageBitmap)return bad();createImageBitmap(f).then(b=>draw(b,b.width,b.height)).catch(bad)};
 im.src=u})}

   for(const l of ls){if(!l.startsWith('data:'))continue;const d=l.slice(5).trim();if(d=='[DONE]')continue;try{const j=JSON.parse(d),t=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;if(t)out+=t}catch{}}}
